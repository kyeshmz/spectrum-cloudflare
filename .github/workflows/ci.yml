name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SPECTRUM_UPSTREAM_CHECKOUT: ${{ github.workspace }}/.upstream/spectrum-ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, matching upstream Spectrum
        with:
          persist-credentials: false
      - name: Check out pinned upstream test sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: photon-hq/spectrum-ts
          ref: d9e39089dc3d1c6f4536826f5ca50798856eecab
          path: .upstream/spectrum-ts
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7, matching upstream Spectrum
        with:
          node-version: 24
      - run: npm install --global pnpm@12.14.0
      - run: pnpm install --frozen-lockfile
      - name: Build, typecheck, upstream compatibility, and Worker tests
        run: pnpm pack:all
      - name: Verify isolated packed consumers
        run: pnpm check:packed
